<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La vie nocturne des jeunes à Genève</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12071f;--card:#1f0f35;--tx:#fff;--mut:#cdbce6;--p1:#a855f7;--p2:#3b82f6;--p3:#ec4899;--p4:#22c55e;--p5:#f97316;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12071f;--card:#1f0f35;--tx:#fff;--mut:#cdbce6}}
:root[data-theme="dark"]{--bg:#12071f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,#3b1370 0,var(--bg) 55%) fixed;color:var(--tx);font-family:Poppins,Arial,sans-serif;overflow-x:hidden}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:6px;width:0;background:linear-gradient(90deg,var(--p1),var(--p3),var(--p5),var(--p4),var(--p2));z-index:20;transition:width .4s}
.conf{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 80px}
header{text-align:center;padding:30px 0 10px}
.ball{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 35% 30%,#fff,#c9a7f5 30%,#7c3aed 70%,#2e1065);box-shadow:0 0 40px var(--p1);animation:spin 3s ease-in-out infinite alternate;position:relative}
.ball:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,#0000 0 8px,#fff3 8px 9px),repeating-linear-gradient(90deg,#0000 0 8px,#fff3 8px 9px)}
@keyframes spin{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(10px)}}
h1{font-size:clamp(28px,7vw,46px);font-weight:800;margin:0;background:linear-gradient(90deg,var(--p3),var(--p5),var(--p1),var(--p2));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{color:var(--mut)}
.part{margin:36px 0 14px;padding:14px 18px;border-radius:16px;font-weight:800;font-size:20px;background:var(--c);box-shadow:0 0 24px var(--c);animation:glow 2.5s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 6px var(--c)}}
.tag{font-weight:600;letter-spacing:2px;color:var(--mut);margin:0 0 10px 4px;font-size:13px}
.q{background:var(--card);border:1px solid #fff2;border-left:6px solid var(--c);border-radius:16px;padding:16px;margin-bottom:14px;opacity:0;transform:translateY(24px);transition:.6s}
.q.in{opacity:1;transform:none}
.q h3{margin:0 0 4px;font-size:17px}.q small{display:block;color:var(--mut);margin-bottom:8px}
.o{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-top:8px;border-radius:12px;background:#ffffff0d;cursor:pointer;transition:.2s;border:2px solid transparent}
.o:hover{transform:translateX(6px);background:#ffffff1a}
.o input{accent-color:var(--c);width:18px;height:18px}
.o:has(input:checked){border-color:var(--c);background:#ffffff22;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.04)}}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid #fff3;background:#ffffff0d;color:var(--tx);padding:10px;font:inherit}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph label{cursor:pointer;text-align:center;font-weight:800;border-radius:14px;overflow:hidden;border:3px solid transparent;transition:.25s;background:#ffffff0d;display:block}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph label:hover{transform:scale(1.03) rotate(-1deg)}
.ph input{display:none}.ph label:has(input:checked){border-color:var(--c);box-shadow:0 0 25px var(--c);transform:scale(1.04)}
.ph span{display:block;padding:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:center}td:first-child,th:first-child{text-align:left}
.end{text-align:center;margin-top:30px}
button{font:inherit;font-weight:800;color:#fff;border:0;border-radius:999px;padding:14px 34px;font-size:18px;cursor:pointer;background:linear-gradient(90deg,var(--p3),var(--p5));animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.07)}}
#thx{display:none;font-size:22px;font-weight:800;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.q{opacity:1;transform:none}}
</style>
<style id="v2">
.vf{margin-top:6px;break-inside:avoid;border-top:1px dashed #ccc;padding-top:4px}.vf .st{font-size:10pt}.vf .ch{display:flex;gap:18px;margin-left:14px}
.vf .ans{font-size:8.5pt;color:#666;font-style:italic;margin:0 0 2px 14px}
.lex{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:0;font-size:9pt}.lex div{break-inside:avoid}.lex dt{font-weight:800;color:var(--c);display:inline}.lex dt:after{content:" : "}.lex dd{display:inline;margin:0}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}.gal figure{margin:0;text-align:center;border:2px solid var(--c);border-radius:8px;overflow:hidden}.gal img{width:100%;height:68px;object-fit:cover;display:block}.gal figcaption{font-size:8pt;font-weight:800;padding:2px}
.sq{font-size:10pt;font-weight:600;margin-top:6px}
.q:has(.lex){background:#faf5ff}
</style><style>
.rows{overflow:hidden;margin:10px -16px;padding:4px 0}.mq{display:flex;width:max-content;gap:8px;margin:12px 0;animation:slide 22s linear infinite}
.mq:nth-child(2){animation-duration:28s;animation-direction:reverse}.mq:nth-child(3){animation-duration:19s}.rows:hover .mq{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{border:2px solid #3b82f6;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;background:#ffffff0d;color:#fff;transition:.2s}
.chip.sel{background:#3b82f6;box-shadow:0 0 16px #3b82f6;transform:scale(1.08)}.chip.sel:after{content:" ✓"}
.cnt{font-weight:800;color:#8ec0ff;text-align:center;min-height:20px}
.card{border:2px solid #ec4899;background:#ec489918;border-radius:20px;padding:22px 16px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:17px;line-height:1.4}
.card.go{animation:cin .45s}.card.out{animation:cout .33s forwards}
@keyframes cin{from{opacity:0;transform:translateX(40px)}}@keyframes cout{to{opacity:0;transform:translateX(-60px) rotate(-4deg)}}
.kp{font-size:12px;color:var(--mut);margin-bottom:6px}.kd{text-align:center;font-weight:800;padding:20px}
.b{display:block;width:100%;font:inherit;font-weight:800;color:#fff;border:0;border-radius:14px;padding:12px;margin-top:10px;cursor:pointer;font-size:15px;animation:none}
.b:active{transform:scale(.95)}.b.v{background:#22c55e}.b.f{background:#ef4468}.b.n{background:#7c7c92;font-weight:600;font-size:13px}
#prev{background:#ffffff18;border:2px dashed #fff4;border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:13px;color:#cdbce6}
@media print{.chip,.mq{animation:none}}
</style></head><body>

<div class="end"><button id="go">Envoyer mes réponses 🎉</button><div id="thx">Merci pour tes réponses ! 💜</div></div></main>
